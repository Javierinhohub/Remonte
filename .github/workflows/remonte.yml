# 1parrainage : 2 remontees par jour (apres 9h30 et apres 15h30, heure de Paris).
# GitHub est sollicite toutes les 30 min ; decider.py dit si c'est le moment.
name: Remontee 1parrainage

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  decider:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.d.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: python3 decider.py

  remonter:
    needs: decider
    if: needs.decider.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer le navigateur
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Remonter les annonces
        env:
          P_EMAIL: ${{ secrets.P_EMAIL }}
          P_PASSWORD: ${{ secrets.P_PASSWORD }}
          MODE: manuel
        run: python remontee.py
      - name: Garder les captures d'ecran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: captures/
          retention-days: 7

