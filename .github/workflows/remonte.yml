# 1parrainage : remontee auto vers 9h30 et 15h30 (Paris, hiver)
# Horaires de secours 1h plus tard, ignores si deja fait.
name: Remontee 1parrainage

on:
  schedule:
    - cron: "23 8 * * *"
    - cron: "47 9 * * *"
    - cron: "23 14 * * *"
    - cron: "47 15 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  remonter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deja fait recemment ?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            since=$(date -u -d '-75 minutes' +%Y-%m-%dT%H:%M:%SZ)
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w remonte.yml -e schedule -s success --created ">=$since" --json databaseId -q length || echo 0)
            if [ "$n" -gt 0 ]; then echo "Deja fait, on saute."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != '1'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != '1'
        with:
          python-version: "3.12"
      - name: Installer le navigateur
        if: steps.check.outputs.skip != '1'
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Remonter les annonces
        if: steps.check.outputs.skip != '1'
        env:
          P_EMAIL: ${{ secrets.P_EMAIL }}
          P_PASSWORD: ${{ secrets.P_PASSWORD }}
          MODE: manuel
        run: python remontee.py
      - name: Garder les captures d'ecran
        if: always() && steps.check.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: captures/
          retention-days: 7
