# Publication + remontee automatique des annonces sur leparrain.com
# Heures en UTC (+1h a Paris l'hiver) : 9h30, 12h30, 15h30, 19h30 a Paris.
name: Le Parrain

on:
  schedule:
    - cron: "30 8 * * *"
    - cron: "30 11 * * *"
    - cron: "30 14 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "publier (1re fois), remonter, ou decouvrir"
        default: publier
        type: choice
        options: [publier, remonter, decouvrir]

jobs:
  leparrain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Le Parrain
        env:
          LP_MCP_URL: ${{ secrets.LP_MCP_URL }}
          ACTION: ${{ github.event.inputs.action || 'remonter' }}
        run: |
          cat > leparrain.py <<'PYEOF'
          import json, os, re, sys, urllib.request, urllib.error

          URL = os.environ.get("LP_MCP_URL", "").strip()
          ACTION = os.environ.get("ACTION", "remonter")  # decouvrir | publier | remonter

          ANNONCES = [
              {
                  "marque": "RED by SFR",
                  "titre": "Jusqu'à 15 € offerts sur ta 1ère facture RED by SFR",
                  "code": "REDB483D8F",
                  "lien": "https://www.red-by-sfr.fr/?codeP=REDB483D8F",
                  "texte": """🎁 Jusqu'à 15 € offerts sur ta 1ère facture RED by SFR !

          ✅ 15 € pour une RED Box (fibre) – 10 € pour un forfait mobile
          ✅ Sans engagement, cumulable avec les promos en cours

          👉 Comment en profiter (2 min) :
          1. Clique sur mon lien : https://www.red-by-sfr.fr/?codeP=REDB483D8F
          2. Ou saisis le code REDB483D8F au moment de souscrire
          3. Choisis ton forfait ou ta box, c'est tout !

          💬 Je réponds vite à toutes tes questions par la messagerie du site. N'hésite pas !""",
              },
              {
                  "marque": "BoursoBank",
                  "titre": "Jusqu'à 160 € offerts chez BoursoBank – ma prime va à une association",
                  "code": "NAGA0360",
                  "lien": "",
                  "texte": """💚 Jusqu'à 160 € offerts chez BoursoBank… et ma prime part à une association !

          Code parrain : NAGA0360

          Éducateur, je reverse ma prime de parrain à une association.

          👉 Comment faire :
          1. Ouvre ton compte BoursoBank avec le code NAGA0360
          2. Effectue ton 1er versement (il conditionne le montant de ta prime)
          3. Reçois ta prime, et fais une bonne action au passage 🙏

          💬 Une question ? Écris-moi, je réponds vite.""",
              },
              {
                  "marque": "Hello bank",
                  "titre": "Jusqu'à 330 € offerts chez Hello bank (offre flash jusqu'au 8 décembre)",
                  "code": "",
                  "lien": "",
                  "texte": """🎁 Jusqu'à 330 € offerts chez Hello bank ! (offre flash jusqu'au 8 décembre)
          💚 Et ma prime de parrain est reversée à une association !

          ✅ 130 € en argent + 200 € en bons d'achat (selon l'offre choisie)
          ✅ Banque en ligne du groupe BNP Paribas, appli simple et carte gratuite avec Hello One

          👉 Comment faire :
          1. Envoie-moi un message avec ton prénom, ton nom et ton e-mail
          2. Je t'envoie l'invitation officielle Hello bank! depuis mon espace client
          3. Ouvre ton compte via le lien reçu par e-mail, c'est tout !

          💬 Éducateur, je réponds rapidement à toutes tes questions. Fais une bonne affaire… et une bonne action 🙏""",
              },
              {
                  "marque": "Acheel",
                  "titre": "1 mois offert sur ton assurance Acheel avec le code NAGA0360",
                  "code": "NAGA0360",
                  "lien": "",
                  "texte": """🎁 1 MOIS OFFERT sur ton assurance Acheel avec le code NAGA0360 !

          ✅ Assurance 100 % en ligne, prix doux et service client très réactif
          ✅ Je suis assurée chez eux pour mon animal et j'en suis ravie

          👉 Comment en profiter :
          1. Fais ton devis sur le site Acheel
          2. Saisis le code NAGA0360 au moment de souscrire
          3. Ton 1er mois est offert, c'est tout !

          💬 Une question sur Acheel ou sur l'assurance animaux ? Écris-moi, je réponds vite.""",
              },
          ]

          session = None
          next_id = 0


          def rpc(method, params=None, notify=False):
              global session, next_id
              body = {"jsonrpc": "2.0", "method": method}
              if params is not None:
                  body["params"] = params
              if not notify:
                  next_id += 1
                  body["id"] = next_id
              req = urllib.request.Request(URL, data=json.dumps(body).encode(), method="POST")
              req.add_header("Content-Type", "application/json")
              req.add_header("Accept", "application/json, text/event-stream")
              req.add_header("MCP-Protocol-Version", "2025-06-18")
              if session:
                  req.add_header("Mcp-Session-Id", session)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      session = r.headers.get("Mcp-Session-Id") or session
                      raw = r.read().decode("utf-8", "replace")
                      ctype = r.headers.get("Content-Type", "")
              except urllib.error.HTTPError as e:
                  sys.exit(f"ECHEC HTTP {e.code} sur {method} : {e.read().decode('utf-8', 'replace')[:500]}")
              if notify:
                  return None
              msgs = []
              if "text/event-stream" in ctype:
                  for line in raw.splitlines():
                      if line.startswith("data:"):
                          try:
                              msgs.append(json.loads(line[5:].strip()))
                          except Exception:
                              pass
              else:
                  msgs.append(json.loads(raw))
              for m in msgs:
                  if m.get("id") == body["id"]:
                      if "error" in m:
                          raise RuntimeError(json.dumps(m["error"], ensure_ascii=False))
                      return m.get("result")
              raise RuntimeError(f"Pas de reponse pour {method} : {raw[:300]}")


          def call(tool, args):
              res = rpc("tools/call", {"name": tool["name"], "arguments": args})
              txt = "\n".join(c.get("text", "") for c in (res or {}).get("content", []) if c.get("type") == "text")
              if res and res.get("structuredContent"):
                  txt += "\n" + json.dumps(res["structuredContent"], ensure_ascii=False)
              return bool(res and res.get("isError")), txt


          def find(tools, include, exclude=r"delete|supprim|remove|boost|pay|achat|premium|checkout|unpubl|d[ée]publi"):
              out = []
              for t in tools:
                  hay = (t["name"] + " " + (t.get("description") or "")).lower()
                  if re.search(include, t["name"].lower()) and not re.search(exclude, t["name"].lower()):
                      out.append(t)
              if not out:
                  for t in tools:
                      hay = (t["name"] + " " + (t.get("description") or "")).lower()
                      if re.search(include, hay) and not re.search(exclude, t["name"].lower()):
                          out.append(t)
              return out


          FIELD_MAP = [
              (r"titre|title|headline|nom_annonce", "titre"),
              (r"desc|texte|text|content|contenu|body|message|annonce", "texte"),
              (r"lien|link|url", "lien"),
              (r"code", "code"),
              (r"marque|brand|merchant|marchand|enseigne|company|entreprise|offre|offer|program|programme|service|name|nom|query|slug", "marque"),
          ]


          def build_args(tool, ad):
              schema = tool.get("inputSchema") or {}
              props = schema.get("properties") or {}
              required = schema.get("required") or []
              args, missing = {}, []
              for p, spec in props.items():
                  val = None
                  for rx, key in FIELD_MAP:
                      if re.search(rx, p.lower()):
                          val = ad.get(key) or None
                          break
                  if val is not None:
                      if spec.get("type") == "array":
                          val = [val]
                      args[p] = val
                  elif p in required:
                      missing.append(p)
              return args, missing


          def main():
              if not URL:
                  sys.exit("Secret LP_MCP_URL manquant.")
              print("Action :", ACTION)
              rpc("initialize", {"protocolVersion": "2025-06-18", "capabilities": {},
                                 "clientInfo": {"name": "robot-remontee", "version": "1.0"}})
              rpc("notifications/initialized", notify=True)
              tools = (rpc("tools/list") or {}).get("tools", [])
              print(f"{len(tools)} outil(s) Le Parrain :")
              for t in tools:
                  req = (t.get("inputSchema") or {}).get("required") or []
                  props = list(((t.get("inputSchema") or {}).get("properties") or {}).keys())
                  print(f"  - {t['name']} {props} requis={req}")
                  print(f"      {(t.get('description') or '')[:300]}")
              if ACTION == "decouvrir":
                  return

              lister = find(tools, r"list|mes_annonces|my_|mine|get_annonces|annonces",
                            exclude=r"delete|supprim|remove|create|cr[ée]|publi|add|ajout|update|edit|modif|bump|remont|boost")
              existing = ""
              for t in lister[:1]:
                  _, missing = build_args(t, {})
                  if not missing:
                      err, existing = call(t, {})
                      print(f"\nMes annonces actuelles ({t['name']}) :\n{existing[:2000]}")

              if ACTION == "publier":
                  creer = find(tools, r"create|creer|cr[ée]er|publi|post|add|ajout|new|nouvelle")
                  if not creer:
                      sys.exit("ECHEC : aucun outil de publication trouve (voir la liste ci-dessus).")
                  t = creer[0]
                  print(f"\nOutil de publication : {t['name']}")
                  ok = tried = 0
                  for ad in ANNONCES:
                      low = existing.lower()
                      if (ad["code"] and ad["code"].lower() in low) or ad["marque"].lower() in low:
                          print(f"- {ad['marque']} : deja publiee, ignoree.")
                          continue
                      args, missing = build_args(t, ad)
                      if missing:
                          print(f"- {ad['marque']} : champs requis non reconnus {missing}, annonce NON publiee.")
                          continue
                      tried += 1
                      err, txt = call(t, args)
                      print(f"- {ad['marque']} : {'ERREUR' if err else 'publiee'} -> {txt[:400]}")
                      ok += 0 if err else 1
                  if tried and ok == 0:
                      sys.exit("Aucune annonce publiee (voir details ci-dessus).")

              if ACTION in ("publier", "remonter"):
                  remonter = find(tools, r"bump|remont|refresh|up$|_up|top|rafraich|actualis")
                  if not remonter:
                      print("\nAucun outil de remontee disponible.")
                      if ACTION == "remonter":
                          sys.exit(1)
                      return
                  t = remonter[0]
                  print(f"\nOutil de remontee : {t['name']}")
                  props = ((t.get("inputSchema") or {}).get("properties") or {})
                  required = (t.get("inputSchema") or {}).get("required") or []
                  id_field = next((p for p in props if re.search(r"id", p.lower())), None)
                  if not required:
                      err, txt = call(t, {})
                      print(("ERREUR" if err else "OK"), "->", txt[:600])
                      if err:
                          sys.exit(1)
                      return
                  if id_field and id_field in required:
                      err, existing = call(lister[0], {}) if lister else (True, "")
                      ids = list(dict.fromkeys(re.findall(r'"(?:id|annonce_id|listing_id)"\s*:\s*"?([\w-]+)"?', existing)))
                      if not ids:
                          sys.exit("ECHEC : impossible de trouver les identifiants de tes annonces.")
                      fails = 0
                      for i in ids:
                          err, txt = call(t, {id_field: i})
                          print(f"- annonce {i} : {'ERREUR' if err else 'OK'} -> {txt[:300]}")
                          fails += err
                      if fails == len(ids):
                          sys.exit(1)
                      return
                  sys.exit(f"ECHEC : parametres requis non reconnus pour {t['name']} : {required}")


          if __name__ == "__main__":
              main()
          PYEOF
          python3 leparrain.py
