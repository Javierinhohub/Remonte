# Le Parrain : publication + remontee (9h30, 12h30, 15h30, 19h30 a Paris)
name: Le Parrain

on:
  schedule:
    - cron: "30 8 * * *"
    - cron: "30 11 * * *"
    - cron: "30 14 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "publier, remonter ou decouvrir"
        default: publier
        type: choice
        options: [publier, remonter, decouvrir]

jobs:
  leparrain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Le Parrain
        env:
          LP_MCP_URL: ${{ secrets.LP_MCP_URL }}
          ACTION: ${{ github.event.inputs.action || 'remonter' }}
        run: python3 leparrain.py
